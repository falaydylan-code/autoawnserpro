<!doctype html><html lang="en"><meta charset="utf-8"><title>Practice assignment · Assignment Lab</title>
<style>body{font:18px system-ui;color:#172b37;background:#eef2f3;max-width:800px;margin:50px auto;padding:24px}main{background:white;border:1px solid #cbd6da;border-radius:14px;padding:32px}label{display:block;padding:14px;border:1px solid #ccd5da;border-radius:6px;margin:12px 0}input{font:inherit;padding:10px}button{font:inherit;padding:12px 26px;background:#165e53;color:white;border:0;border-radius:6px;cursor:pointer}svg{width:100%;max-height:330px}small{color:#526571}</style>
<body data-practice="assignment-agent-v1"><small>ASSIGNMENT LAB / BROWSER PRACTICE</small><h1>Four questions. One complete loop.</h1><p>This practice page tests reading, graph capture, answer entry, and navigation.</p><main id="content"></main>
<script>
const questions=[
{text:'Question 1 of 4 — What is 2 + 2?',options:['3','4','5','6']},
{text:'Question 2 of 4 — In the supply and demand graph below, demand shifts from D₁ to D₂ while supply stays fixed. What happens to equilibrium price?',options:['Price decreases','Price stays constant','Price increases'],graph:true},
{text:'Question 3 of 4 — Differentiate f(x) = x². What is f′(3)? Enter a number.'},
{text:'Question 4 of 4 — What is the mean of 8, 10, and 12? Enter a number.'}
];
let index=0;const answers=[];
function render(){const q=questions[index];document.querySelector('#content').innerHTML=`<section data-agent-question><h2>${q.text}</h2>${q.graph?`<svg viewBox="0 0 600 360" role="img" aria-label="Supply and demand graph"><rect width="600" height="360" fill="white"/><path d="M70 20V300H550" fill="none" stroke="#334155" stroke-width="2"/><text x="10" y="30">Price</text><text x="450" y="345">Quantity</text><path d="M100 270L470 40" stroke="#b45c2c" stroke-width="4"/><text x="480" y="45">S</text><path d="M90 50L400 285" stroke="#387d98" stroke-width="4"/><text x="405" y="292">D₁</text><path d="M200 35L520 265" stroke="#195c50" stroke-width="4"/><text x="525" y="270">D₂</text><path d="M190 135H265" stroke="#344054" stroke-width="2"/><path d="M255 128L266 135L255 142" fill="none" stroke="#344054" stroke-width="2"/><text x="300" y="325">Demand shifts right</text></svg>`:''}${q.options?q.options.map((o,i)=>`<label><input type="radio" name="answer" value="${i}"> ${o}</label>`).join(''):'<label>Your answer <input data-agent-answer type="text" inputmode="decimal" autocomplete="off"></label>'}</section><p id="error" role="alert"></p><button ${index<3?'data-agent-next':'data-agent-submit'} onclick="advance()">${index<3?'Next question →':'Submit assignment'}</button>`;}
function advance(){const selected=document.querySelector('input:checked');const typed=document.querySelector('[data-agent-answer]');if(!selected&&!typed?.value.trim()){document.querySelector('#error').textContent='Please enter an answer first.';return;}answers[index]=selected?questions[index].options[Number(selected.value)]:typed.value.trim();if(index<3){index++;render();}else{document.querySelector('#content').innerHTML='<section data-agent-complete><h2>Assignment submitted</h2><p>All four answers were received. Browser workflow complete.</p></section>';}}
render();
</script></body></html>
