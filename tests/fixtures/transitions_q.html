<!doctype html><meta charset="utf-8"><title>Question frame</title>
<style>body{font:16px sans-serif;margin:12px}input{width:120px;padding:6px}output{display:block;margin-top:8px;color:#060}</style>
<!-- The question frame of transitions.html. ?q=N picks the question; &graded=1 shows the grade; &stem=revised rewrites
     the question wording; &slow=1 renders the answer field 800 ms after load; &stray=1 reloads the document as soon
     as a value is typed. Entered values are kept in the SHELL (parent.answers) so they survive a reload, as they do
     on the real site. The shell records every load in parent.loads. -->
<main>
  <h2 id="stem"></h2>
  <div id="body"></div>
  <output id="feedback" role="status"></output>
</main>
<script>
const p=new URLSearchParams(location.search);let n=Number(p.get('q')||1);
// McGraw's accounting-tool frame has no <main>, no role=main, no question id: the harness's question root is <body>.
if(p.get('bare')){const m=document.querySelector('main'),d=document.createElement('div');while(m.firstChild)d.appendChild(m.firstChild);m.replaceWith(d)}
parent.loads.push(location.search);
function render(){body.innerHTML='<label>Amount <input id="amount" type="text"></label>';amount.value=p.get('wipe')?'':(parent.answers[n]||'');
  amount.addEventListener('input',()=>{parent.answers[n]=amount.value;if(p.get('stray'))location.reload()});}
function show(q){n=q;stem.textContent=`Question ${n}: enter the amount for item ${n}`+(p.get('stem')==='revised'?' (revised)':'');feedback.textContent='';render()}
function grade(){feedback.textContent='Correct'}
window.show=show;window.grade=grade;
stem.textContent=`Question ${n}: enter the amount for item ${n}`+(p.get('stem')==='revised'?' (revised)':'');
if(p.get('slow'))setTimeout(render,800);else render();
if(p.get('graded'))grade();
// McGraw's accounting tool marks the whole page when it grades: $("body").addClass("pregrade-mode")
if(p.get('pregrade'))document.body.classList.add('pregrade-mode');
// a grade banner marked up with nothing the harness recognises as feedback
// a graded page that shows ONLY a verdict: its question wording is gone, so every question's graded page reads alike
if(p.get('only'))stem.textContent='';
if(p.get('banner'))(document.querySelector('main')||document.body).insertAdjacentHTML('afterbegin','<div>Answer is complete and correct.</div>');
</script>
