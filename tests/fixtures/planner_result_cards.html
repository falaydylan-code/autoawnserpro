<!doctype html><meta charset="utf-8"><title>Result cards</title>
<style>section{margin:8px;padding:15px;border:2px solid #777;width:600px;min-height:32px} [aria-label=check]{display:inline-block;color:green;margin-left:10px} svg{width:20px;height:20px}</style>
<main><article aria-live="polite"><h1>How is power distributed?</h1><p>Choose an answer.</p>
<div id="answers" data-testid="MCQ Answers">
<div><section tabindex="0"><div data-testid="option-1">Power is central.</div></section></div>
<div><section tabindex="0"><div data-testid="option-2">Power is shared.</div></section></div>
<div><section tabindex="0"><div data-testid="option-3">Power is local.</div></section></div>
</div></article></main>
<script>
window.clicks=[];window.nextQuestion=()=>{document.querySelector('h1').textContent='Which level has authority?';document.querySelectorAll('[data-testid=AssemblyAnimatedIcon--CSS],svg').forEach(e=>e.remove());};
window.grade=(card,correct)=>{
 if(correct)card.insertAdjacentHTML('beforeend','<div data-testid="AssemblyAnimatedIcon--CSS" aria-label="check">✓</div>');
 else {card.insertAdjacentHTML('beforeend','<svg data-testid="icon-close-x"><title>Incorrect</title></svg>');document.querySelectorAll('section')[1].insertAdjacentHTML('beforeend','<svg data-testid="icon-check"><title>REVEALED ANSWER KEY</title></svg>');}
};
document.querySelectorAll('section').forEach((e,i)=>e.onclick=()=>{clicks.push(i);grade(e,i===1);});
</script>
