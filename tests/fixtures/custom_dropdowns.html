<!doctype html><meta charset="utf-8"><title>Worksheet dropdown regression</title>
<style>td,th{border:1px solid;padding:8px;min-width:150px}table{border-collapse:collapse}ul{background:white;border:1px solid;position:absolute;padding:8px;margin:0}li{padding:5px;list-style:none;cursor:pointer}
.dropdownButton{margin-left:6px;width:22px;height:22px;border:1px solid #888;background:#eee;cursor:pointer;vertical-align:middle}</style>
<h1>Classify each account</h1><table><tr><th>Account</th><th>Account Type</th><th>Statement</th></tr></table><output></output>
<script>
// Ten rows, two custom dropdown cells each. Like the courseware it imitates:
// the cell is the answer field; a separate arrow button also opens it; the
// menu is appended to <body>, OUTSIDE the table, and names its owner.
const names=['Accounts Payable','Common Stock','Equipment','Accounts Receivable','Notes Payable','Cash','Retained Earnings','Office Expense','Sales Revenue','Supplies'];
function openMenu(cell,j){
 document.querySelector('ul')?.remove();
 for(const c of document.querySelectorAll('td.responseCell'))c.setAttribute('aria-expanded','false');
 const menu=document.createElement('ul');menu.role='listbox';menu.id='menu_'+cell.id;menu.setAttribute('aria-labelledby',cell.id);
 const r=cell.getBoundingClientRect();menu.style.left=r.x+'px';menu.style.top=(r.bottom+scrollY)+'px';
 cell.setAttribute('aria-expanded','true');
 for(const label of j?['Income Statement','Balance Sheet']:['Asset','Expense','Liability','Revenue',"Stockholders' Equity"]){
  const option=document.createElement('li');option.role='option';option.textContent=label;
  option.onclick=()=>{cell.querySelector('.dropdownValue').textContent=label;cell.setAttribute('data-value',label);menu.remove();cell.setAttribute('aria-expanded','false');};
  menu.append(option);
 }
 document.body.append(menu);
}
for(let i=0;i<10;i++){
 const row=document.querySelector('table').insertRow();row.insertCell().textContent=names[i];
 for(let j=0;j<2;j++){
  const cell=row.insertCell();cell.id=`cell_${i}_${j}`;cell.className='dropDownList responseCell';cell.tabIndex=1;cell.setAttribute('dropdowntype','dropDown');
  cell.setAttribute('aria-label',names[i]+(j?' Statement':' Account Type'));cell.setAttribute('aria-expanded','false');
  const value=document.createElement('span');value.className='dropdownValue';cell.append(value);
  const arrow=document.createElement('input');arrow.type='button';arrow.className='dropdownButton';arrow.id=`arrow_${i}_${j}`;arrow.setAttribute('aria-label','open '+cell.getAttribute('aria-label'));arrow.setAttribute('aria-controls','menu_'+cell.id);
  cell.append(arrow);
  // the cell toggles; the arrow opens
  cell.onclick=e=>{if(e.target===arrow)return;if(cell.getAttribute('aria-expanded')==='true'){document.querySelector('ul')?.remove();cell.setAttribute('aria-expanded','false');}else openMenu(cell,j);};
  arrow.onclick=e=>{e.stopPropagation();openMenu(cell,j);};
 }
}
</script>
