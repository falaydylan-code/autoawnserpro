<!doctype html><meta charset="utf-8"><title>Assignment shell whose question frame reloads on Check and Next</title>
<style>body{font:16px sans-serif;margin:20px}main{max-width:900px}iframe{display:block;width:860px;height:220px;border:1px solid #888;margin:12px 0}button{padding:8px 16px;margin-right:12px}#verdict{display:block;min-height:1.2em}</style>
<!-- McGraw Connect as it stopped the run (Ch.1 Q1, 2026-09-21 8:39 PM, 0.10.44): the question lives in an iframe,
     the "Check my work" and "Next" buttons in the shell. Pressing Check RELOADS the question frame to show the grade
     (the answers survive, the frame is a new document); pressing Next loads the next question into the same frame.
     The harness's first look after its own Check click died "Document was replaced." ?params (shell):
       check=reload  (default) Check reloads the frame with the grade shown; answers kept, still editable
       check=redraw  Check writes the grade into the existing document (no reload -- the old happy path)
       check=top     Check writes the grade into the SHELL's status, the frame is untouched
       check=stem    Check reloads the frame with the grade AND a rewritten question stem (a different question)
       check=none    Check does nothing
       check=rebuild Check DESTROYS the question iframe and inserts a new one at the graded address (McGraw Connect,
                     Ch.3 Q1 2026-09-24 12:10 AM). A new element gets a new browser frame id (1747 -> 1752 live), unlike
                     check=reload, which navigates the same element and keeps its id -- which is why reload passed here
                     and the real site did not.
       check=rebuildstem  Check rebuilds the frame AND rewrites the question stem: a genuinely different question
       check=pregrade    rebuild graded with body.pregrade-mode (McGraw's own code on Check) -- all text lost to [class*=grade]
       check=banner      rebuild graded with a banner none of the feedback rules recognise
       check=wipe        rebuild graded but the answer box comes back EMPTY (text unchanged: the key holds, nothing to judge)
       check=verdictonly the graded page shows only a verdict banner: every question's graded page reads alike
       check=wipebanner  the page reads differently AND the answer is gone -- the answers cannot vouch for it
       check=different   Check lands on a DIFFERENT question (q+1, its box empty)
       check=readonly    rebuild graded as McGraw's read-only review sheet (no input, verdict unrecognised, pregrade-mode,
                         hidden helper textarea) after a 600 ms blank (Ch.3 Q2, 2026-09-24 11:09 PM)
       check=readonlyerased  the same without the helper textarea: pregrade-mode erases the frame's text to its title
       check=spinner     "Loading..." for 1 s, then the ordinary graded page with its box
       check=slowspinner "Loading..." for 6 s, then the ordinary graded page with its box
       check=emptyforever the rebuilt frame never shows anything
       next=rebuild  Next destroys the frame and builds a new one holding question n+1
       delay=<ms>    the reload after Check starts that long after the click
       slow=1        the reloaded frame shows its answer field only 800 ms after it loads (half-loaded meanwhile)
       next=reload   (default) Next loads question n+1 into the frame (new document, new question)
       next=swap     Next rewrites the frame's content in place (same document, new question)
       next=same     Next reloads the frame with the SAME question (new document, same question)
       next=none     Next does nothing
       stray=1       the frame reloads itself the moment a value is typed (a change the harness did not cause)
       bare=1        the question frame has no <main> (McGraw's accounting tool): the harness's root is <body>
     Question 3 is the last: its Next is disabled. -->
<main>
  <div id="position" aria-current="step">Question 1 of 3</div>
  <h1>Chapter 1 homework</h1>
  <p>Enter the amount asked for in the worksheet below. Check your work when you are done, then move on to the next question.</p>
  <iframe id="frame"></iframe>
  <output id="verdict" role="status"></output>
  <button id="check">Check my work</button>
  <button id="next">Next</button>
</main>
<script>
const params=new URLSearchParams(location.search),mode={check:params.get('check')||'reload',next:params.get('next')||'reload'};
window.answers={};window.clicks=[];window.loads=[];let n=1;
frame.src='transitions_q.html?q=1'+(params.get('stray')?'&stray=1':'')+(params.get('bare')?'&bare=1':'');   // stray applies from the first document; slow only to reloads
const extra=()=>(params.get('slow')?'&slow=1':'')+(params.get('stray')?'&stray=1':'')+(params.get('bare')?'&bare=1':'');
const src=(q,graded,stem,more='')=>`transitions_q.html?q=${q}${graded?'&graded=1':''}${stem?'&stem=revised':''}${more}${extra()}`;
const load=(q,graded,stem)=>{document.getElementById('frame').src=src(q,graded,stem)};
const rebuild=(q,graded,stem,more)=>{const f=document.createElement('iframe');f.id='frame';f.src=src(q,graded,stem,more);document.getElementById('frame').replaceWith(f);window.rebuilds=(window.rebuilds||0)+1};
check.onclick=()=>{clicks.push('check');
  if(mode.check==='reload')setTimeout(()=>load(n,true),Number(params.get('delay')||0));
  else if(mode.check==='redraw')document.getElementById('frame').contentWindow.grade();
  else if(mode.check==='top')verdict.textContent='Correct';
  else if(mode.check==='stem')load(n,true,true);
  else if(mode.check==='rebuild')setTimeout(()=>rebuild(n,true),Number(params.get('delay')||0));
  else if(mode.check==='rebuildstem')rebuild(n,true,true);
  else if(mode.check==='pregrade')rebuild(n,true,false,'&pregrade=1');
  else if(mode.check==='banner')rebuild(n,true,false,'&banner=1');
  else if(mode.check==='wipe')rebuild(n,true,false,'&wipe=1');
  else if(mode.check==='wipebanner')rebuild(n,true,false,'&wipe=1&banner=1');
  else if(mode.check==='verdictonly')rebuild(n,true,false,'&banner=1&only=1');
  else if(mode.check==='different')rebuild(n+1,false);
  else if(mode.check==='readonly')rebuild(n,true,false,'&readonly=1&pregrade=1&helper=1&blank=600');
  else if(mode.check==='readonlyerased')rebuild(n,true,false,'&readonly=1&pregrade=1&blank=600');
  else if(mode.check==='spinner')rebuild(n,true,false,'&spinner=1000');
  else if(mode.check==='slowspinner')rebuild(n,true,false,'&spinner=6000');
  else if(mode.check==='emptyforever')rebuild(n,true,false,'&empty=1');};
next.onclick=()=>{clicks.push('next');verdict.textContent='';
  if(mode.next==='reload'){n++;position.textContent=`Question ${n} of 3`;load(n)}
  else if(mode.next==='swap'){n++;position.textContent=`Question ${n} of 3`;document.getElementById('frame').contentWindow.show(n)}
  else if(mode.next==='same')load(n);
  else if(mode.next==='rebuild'){n++;position.textContent=`Question ${n} of 3`;rebuild(n)}
  if(n>=3)next.disabled=true;};
</script>
