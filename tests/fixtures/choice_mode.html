<!doctype html><meta charset="utf-8"><title>Choice group whose instruction the page hides from screen readers</title>
<style>body{font:16px sans-serif;margin:0}header,nav,#controls{padding:8px;background:#eee}main{padding:12px}button{display:block;padding:10px;margin:4px;min-width:320px;text-align:left;border:1px solid}li{list-style:none}fieldset{border:0;padding:0}legend{font-weight:bold}</style>
<!-- The live Khan Academy exercise shape (read from the page on 2026-09-20): the answer group is a list of
     aria-pressed buttons named "(Choice A)".. inside a fieldset whose legend "Choose 1 answer:" is visible on
     screen but carries aria-hidden="true"; share buttons live in <header>, the breadcrumb in <nav>, and the
     exercise controls (Draw on exercise / Start over / Skip / Check) in a plain div. The choices sit in a scrolling
     div[role=group] INSIDE the fieldset (the wrapper that cut the legend out of 0.10.39's text), and the breadcrumb
     is links inside the course accordion, not a <nav>. ?mode=
       legend  -- the aria-hidden legend is present (the live page)
       none    -- no instruction at all: the page says neither pick-one nor pick-many
       hidden  -- the legend exists but is display:none: genuinely not on screen
       all     -- the legend reads "Select all that apply" (multi-select), also aria-hidden
       conflict  -- the legend says both, so no reading (page or model) can stand
       noreadback -- the buttons carry no aria-pressed: selection cannot be read back, so no plan may touch them
     Pressing a choice sets aria-pressed; in single modes the other choices are un-pressed (radio behaviour),
     in "all" they are independent. `clicks` records every choice click. -->
<header><button id="share" aria-label="Share link">Share</button><button id="teams" aria-label="Share to Microsoft Teams (Opens in a new window)">Teams</button></header>
<div role="group" aria-label="Content list"><div role="list" aria-label="Accordion control"><div role="listitem"><div role="region"><h3><a tabindex="0" href="#course">Course: AP Macroeconomics</a></h3><h3><a tabindex="0" href="#unit">Unit 6</a></h3></div></div></div></div>
<main data-question-id="choice-mode">
<form><fieldset>
<legend id="legend" aria-hidden="true">Choose 1 answer:</legend>
<p>The currency of Ghana is the cedi, and the currency of the United States is the dollar. If the exchange rate changes from 5 to 8 cedis per dollar, what will be the effect on net exports and employment in the United States?</p>
<div id="scroll" role="group" style="max-height:600px;overflow:auto"><ul role="list">
<li><button type="button" aria-pressed="false" aria-label="(Choice A)">Net exports and employment will decrease.</button></li>
<li><button type="button" aria-pressed="false" aria-label="(Choice B)">Net exports will increase, but employment will be unaffected.</button></li>
<li><button type="button" aria-pressed="false" aria-label="(Choice C)">Net exports will decrease, but employment will be unaffected.</button></li>
<li><button type="button" aria-pressed="false" aria-label="(Choice D)">Net exports and employment will increase.</button></li>
</ul></div>
</fieldset></form>
<div id="controls"><button type="button" aria-label="Draw on exercise">Draw</button><button type="button" aria-label="Start over">Start over</button><button type="button">Skip</button><button type="button">Check</button></div>
</main>
<script>
const mode=new URLSearchParams(location.search).get('mode')||'legend';window.clicks=[];
const legend=document.getElementById('legend');
if(mode==='none')legend.remove();
if(mode==='hidden')legend.style.display='none';
if(mode==='all')legend.textContent='Select all that apply:';
if(mode==='conflict')legend.textContent='Choose 1 answer. Select all that apply.';   // the page contradicts itself: no claim may settle it
if(mode==='noreadback')for(const b of document.querySelectorAll('ul[role=list] button'))b.removeAttribute('aria-pressed');   // Quizlet-like: nothing to read back
const choices=[...document.querySelectorAll('ul[role=list] button')];
// Screen-readback modes: no aria-pressed anywhere; a selection is only a class (dark background) and a counter.
//   visual       -- pick-many "Select all that apply (3 left)", six cards, counter moves by one per click
//   visual_noop  -- same, but card C ignores clicks entirely (and every card has a hover glow that must not count)
//   visual_grade -- same, but the page grades (role=status text) as soon as two cards are selected
if(mode.startsWith('visual')){
  legend.textContent='Select all that apply (3 left):';
  const list=document.querySelector('ul[role=list]');
  for(const [i,txt] of [['E','Rule of law'],['F','Free elections']])list.insertAdjacentHTML('beforeend',`<li><button type="button" aria-label="(Choice ${i})">${txt}</button></li>`);
  const style=document.createElement('style');style.textContent='ul[role=list] button.selected{background:#1b3a6b;color:#fff;border-color:#1b3a6b}ul[role=list] button:hover{background:#dbe6ff}';document.head.append(style);
  let left=3;const status=document.createElement('div');status.setAttribute('role','status');document.querySelector('main').append(status);
  for(const b of document.querySelectorAll('ul[role=list] button')){b.removeAttribute('aria-pressed');
    b.onclick=()=>{window.clicks.push(b.getAttribute('aria-label'));if(mode==='visual_noop'&&b.getAttribute('aria-label')==='(Choice C)')return;
      const on=!b.classList.contains('selected');b.classList.toggle('selected',on);left+=on?-1:1;legend.textContent=`Select all that apply (${left} left):`;
      if(mode==='visual_grade'&&document.querySelectorAll('ul[role=list] button.selected').length===2)status.textContent='Checked: your answer was recorded.';}}
}
if(!mode.startsWith('visual'))for(const b of choices)b.onclick=()=>{window.clicks.push(b.getAttribute('aria-label'));const on=b.getAttribute('aria-pressed')!=='true';
  if(mode!=='all')for(const o of choices)o.setAttribute('aria-pressed','false');
  b.setAttribute('aria-pressed',on?'true':'false')};
</script>
